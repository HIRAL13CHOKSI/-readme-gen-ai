name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-baseline:
    name: Offline baseline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run mocked baseline tests
        run: python -m unittest discover -s tests -p test_no_ast_pipeline.py -v
      - name: Check CLI and evaluator entry points
        run: |
          python -m readmegenv2 --help
          python tests/run_readmegenv2_eval.py --help
          python tests/run_readmegenv2_no_ast_eval.py --help
